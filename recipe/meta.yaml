{% set name = "geowombat" %}
{% set version = "2.5.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jgrss/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 8fb933560903b83bd7c1cf4a87d887f6aa84d28dc4d2e1670104993756c47716

build:
  number: 0
  skip: true  # [py<310 or py>312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy <2                               # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - ninja

  host:
    - python
    - meson-python
    - cython
    - numpy <2
    - setuptools-scm
    - pip

  run:
    - python
    - dask-core
    - distributed
    - geopandas
    - joblib
    - matplotlib-base
    - numpy <2
    - pandas
    - pyproj
    - rasterio <1.5.0
    - retry
    - requests
    - scikit-learn
    - scipy
    - shapely
    - tqdm
    - xarray
    - h5netcdf
    - h5py
    - cryptography
    - threadpoolctl
    - affine
    - psutil
    - pyyaml
    - python-graphviz

test:
  imports:
    - geowombat
  requires:
    - pytest
    - testfixtures
    - gdal
  source_files:
    - tests
  commands:
    - pytest tests/test_clip.py
    - pytest tests/test_config.py
    # - pytest tests/test_coreg.py
    - pytest tests/test_extract.py
    - pytest tests/test_gdal.py
    - pytest tests/test_moving.py
    - pytest tests/test_nodata.py  # [not win]
    - pytest tests/test_open.py
    - pytest tests/test_properties.py
    # - pytest tests/test_rad.py
    - pytest tests/test_rasterio.py  # [not win]
    - pytest tests/test_scaling.py
    # - pytest tests/test_series.py  # [not win]
    - pytest tests/test_sops.py
    - pytest tests/test_vi.py
    - pytest tests/test_write.py  # [not win]
    - pytest tests/test_xarray.py

outputs:
  - name: geowombat
    script: install-geowombat.sh  # [unix]
    script: install-geowombat.bat  # [win]
    build:
      script_env:
        - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
    requirements:
      build:
        - python                                   # [build_platform != target_platform]
        - cross-python_{{ target_platform }}       # [build_platform != target_platform]
        - cython                                   # [build_platform != target_platform]
        - numpy <2                                 # [build_platform != target_platform]
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - ninja

      host:
        - python
        - meson-python
        - cython
        - numpy <2
        - setuptools-scm
        - pip

      run:
        - python
        - dask-core
        - distributed
        - geopandas
        - joblib
        - matplotlib-base
        - numpy <2
        - pandas
        - pyproj
        - rasterio <1.5.0
        - retry
        - requests
        - scikit-learn
        - scipy
        - shapely
        - tqdm
        - xarray
        - h5netcdf
        - h5py
        - cryptography
        - threadpoolctl
        - affine
        - dateparser
        - psutil
        - pyyaml
        - python-graphviz

    test:
      imports:
        - geowombat
      requires:
        - pytest
        - testfixtures
        - gdal
      source_files:
        - tests
      commands:
        - pytest tests/test_clip.py
        - pytest tests/test_config.py
          # - pytest tests/test_coreg.py
        - pytest tests/test_extract.py
        - pytest tests/test_gdal.py
        - pytest tests/test_moving.py
        - pytest tests/test_nodata.py    # [not win]
        - pytest tests/test_open.py
        - pytest tests/test_properties.py
          # - pytest tests/test_rad.py
        - pytest tests/test_rasterio.py    # [not win]
        - pytest tests/test_scaling.py
          # - pytest tests/test_series.py  # [not win]
        - pytest tests/test_sops.py
        - pytest tests/test_vi.py
        - pytest tests/test_write.py    # [not win]
        - pytest tests/test_xarray.py


  - name: geowombat-coreg
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - earthpy
        - pyfftw >=0.13.1
        - bottleneck
        - cartopy
        - cmocean
        - dill
        - geoarray >=0.15.0
        - geojson
        - folium >=0.6.0,!=0.12.0
        - pykrige
        - arosics
        - py-tools-ds >=0.18.0
          # - pymorph  # not on conda-forge, install via pip
    test:
      imports:
        - geowombat
        # requires:
        #   - pytest
        # source_files:
        #   - tests
        # commands:
        #   - pytest tests/test_coreg.py  # [not win]


  - name: geowombat-docs
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - numpydoc
        - sphinx >=6.0
        - sphinx-automodapi
        - sphinxcontrib-bibtex >=2.5.0
          # - sphinx_tabs  # not on conda-forge
        - pydata-sphinx-theme ==0.13.1
        - sphinx-book-theme >=1.0.0
        - sphinx-copybutton >=0.5.0
        - sphinx-autodoc-typehints
        - ipython
        - python-graphviz
        - gw-sklearn-xarray
        - nbsphinx >=0.9,<1
        - ipykernel
        - myst-parser >=1.0,<2
    test:
      imports:
        - geowombat


  - name: geowombat-ml
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat') }}
        - dask-ml >=2024.4.4
        - scikit-learn >=1.3.0
        - lightgbm
        - gw-sklearn-xarray
        - numpy_groupies
        - numba >=0.57.0
    test:
      imports:
        - geowombat
      requires:
        - pytest
      source_files:
        - tests
      commands:
        - pytest tests/ml_test.py -k "not test_output_values_missing and not test_tree_predict"


  - name: geowombat-perf
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - rtree
        - netCDF4
        - ray-default >=2.3.0    # [not osx]
    test:
      imports:
        - geowombat


  - name: geowombat-stac
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - pystac
        - pystac-client
        - stackstac >=0.5.1
        - planetary-computer
        - Rich
        - wget    # [not win]
          # - wrapt-timeout-decorator  # not on conda-forge
    test:
      imports:
        - geowombat


  - name: geowombat-tests
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - testfixtures
        - jax    # [not win]
        - jaxlib    # [not win]
        - pre-commit
        - black
        - flake8
        - docformatter
        - isort
        - validators
    test:
      imports:
        - geowombat
      requires:
        - pytest
      source_files:
        - tests
      commands:
        - pytest tests/test_series.py    # [not win]

  - name: geowombat-view
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - ipython
        - bokeh
        - descartes
        - python-graphviz
    test:
      imports:
        - geowombat


  - name: geowombat-web
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - gsutil
        - requests
        - wget    # [not win]
    test:
      imports:
        - geowombat


  - name: geowombat-zarr
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - zarr
        - numcodecs
    test:
      imports:
        - geowombat


  - name: geowombat-dl
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - pytorch >=2.0.0
        # pytorch-tabnet >=4.0 omitted: the conda-forge build pins
        # pytorch <2.0, which conflicts with torchgeo/SMP. Install via
        # pip if needed: `pip install pytorch-tabnet`.
        - torchgeo >=0.6.0
        - segmentation-models-pytorch >=0.3.0
    test:
      imports:
        - geowombat


  - name: geowombat-detect
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        - ultralytics >=8.2
        - torchmetrics >=1.0
        - pycocotools
        - pyyaml
        - pillow
        # opencv-python>=4.12 requires numpy>=2; the rest of geowombat
        # pins numpy<2. Keep the older opencv build compatible with that.
        - py-opencv <4.12
    test:
      imports:
        - geowombat


  - name: geowombat-sam
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('geowombat', exact=True) }}
        # - segment-anything  # not on conda-forge, install via pip
    test:
      imports:
        - geowombat

about:
  home: https://github.com/jgrss/geowombat
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: GeoWombat provides utilities to process geospatial raster data.
  doc_url: https://geowombat.readthedocs.io/
  dev_url: https://github.com/jgrss/geowombat

extra:
  recipe-maintainers:
    - mxr-conda
    - mmann1123

# notes:
# build local: `python build-locally.py`
# get sha256: wget -qO- https://github.com/jgrss/geowombat/archive/refs/tags/v<VERSION>.tar.gz | sha256sum
